<div class="modal-backdrop">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Registrar Nuevo Explorador</h2>
      <button class="btn-cerrar-x" (click)="cerrar.emit()">✕</button>
    </div>

    <form class="modal-body" [formGroup]="formularioEstudiante" (ngSubmit)="guardarEstudiante()">

      <div class="mb-3 form-group">
        <label class="form-label d-block">Foto de Perfil</label>

        <input
          type="file"
          #fileInput
          (change)="capturarNombreArchivo($event)"
          accept="image/*"
          style="display: none;"
        />

        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="fileInput.click()">
            📷 Seleccionar Imagen
          </button>

          @if (formularioEstudiante.get('imagenUrl')?.value) {
          <span class="form-group text-success small">
        ✓ {{ formularioEstudiante.get('imagenUrl')?.value }}
      </span>
          }
        </div>
      </div>

      <div class="form-group">
        <label for="documento">Documento de Identidad</label>
        <input type="text" id="documento" formControlName="documento" class="form-control" placeholder="Ej: 12345678">
      </div>

      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" formControlName="nombre" placeholder="Ej. Juan Pérez">
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" formControlName="apellido" class="form-control" placeholder="Ej: Mazo">
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" formControlName="correo" placeholder="Ej. juan.perez&#64;mail.com">
      </div>

      <div class="form-group">
        <label for="estado">Estado Inicial</label>
        <select id="estado" formControlName="estado">
          <option value="true">Activo</option>
          <option value="false">Inactivo</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancelar" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit" class="btn-guardar">Guardar Estudiante</button>
      </div>

    </form>

  </div>
</div>
