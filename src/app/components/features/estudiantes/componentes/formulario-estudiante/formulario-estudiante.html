<div class="modal-overlay">
  <div class="modal-wrapper">

    <div class="modal-header">
      <h2>Registrar Nuevo Estudiante</h2>
      <button type="button" class="btn-close-x" (click)="cerrar.emit()" [disabled]="guardando">✕</button>
    </div>

    <!-- 🎯 Banner Estético de Errores en lugar de alert() -->
    <div *ngIf="mensajeError" class="error-banner">
      <span>⚠️ {{ mensajeError }}</span>
      <button type="button" (click)="mensajeError = null">✕</button>
    </div>

    <form [formGroup]="formularioEstudiante" (ngSubmit)="guardarEstudiante()">
      <div class="modal-body-form">

        <div class="avatar-section">
          <div class="avatar-box">
            <div *ngIf="!imagenPreview" class="avatar-placeholder">
              <span style="font-size: 2.5rem;">👤</span>
              <span style="font-size: 0.8rem; font-weight: 500;">Sin foto</span>
            </div>
            <img *ngIf="imagenPreview" [src]="imagenPreview" alt="Vista previa" class="avatar-img">
          </div>

          <label class="file-input-label">
            Seleccionar Foto
            <input type="file" (change)="capturarNombreArchivo($event)" style="display: none;" accept="image/*">
          </label>
        </div>

        <div class="fields-grid">

          <div class="form-group">
            <label>Documento / Identificación</label>
            <input type="text" class="form-control" formControlName="documento" placeholder="Ej: 10023456">
          </div>

          <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" class="form-control" formControlName="correo" placeholder="ejemplo@correo.com">
          </div>

          <div class="form-group">
            <label>Nombres</label>
            <input type="text" class="form-control" formControlName="nombre" placeholder="Primer y segundo nombre">
          </div>

          <div class="form-group">
            <label>Telefono</label>
            <input type="number" class="form-control" formControlName="telefono" placeholder="1234567890">
          </div>

          <div class="form-group">
            <label>Apellidos</label>
            <input type="text" class="form-control" formControlName="apellido" placeholder="Apellidos completos">
          </div>

          <div class="form-group">
            <label>Estado Inicial</label>
            <select class="form-control" formControlName="estado">
              <option [value]="true">Activo</option>
              <option [value]="false">Inactivo / Bloqueado</option>
            </select>
          </div>

          <div class="form-group">
            <label>Asignar Profesor</label>
            <select class="form-control" formControlName="profesorId">
              <option value="" disabled selected>Seleccione un profesor</option>
              <option *ngFor="let prof of listaProfesores" [value]="prof.id">
                {{ prof.nombre }} {{ prof.apellido }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label>Asignar Tarifa</label>
            <select class="form-control" formControlName="tarifaId">
              <option value="" disabled selected>Seleccione una Tarifa</option>
              <option *ngFor="let tarifa of listaTarifa" [value]="tarifa.id">
                {{ tarifa.descripcion }}
              </option>
            </select>
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancelar" (click)="cerrar.emit()" [disabled]="guardando">Cancelar</button>
        <button type="submit" class="btn-registrar" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar Estudiante' }}
        </button>
      </div>
    </form>

  </div>
</div>
