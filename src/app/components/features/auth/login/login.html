<div class="login-page">
  <div class="login-card">

    <!-- LADO IZQUIERDO: Panel Visual / Imagen -->
    <div class="login-banner">
      <div class="banner-overlay"></div>
      <!-- Cambia el src por la ruta de la imagen que quieras para el login -->
      <img src="fotos-alumnos/logo2.jpg" alt="Future Explorers Logo" class="banner-image" />
      <div class="banner-content">
        <h2>Plataforma Web</h2>
        <p>Explora, gestiona y transforma la educación del futuro.</p>
      </div>
    </div>

    <!-- LADO DERECHO: Formulario de Login -->
    <div class="login-form-container">
      <div class="brand-header">
        <span class="brand-name">Future<strong>Explorers</strong></span>
        <h1 class="login-title">¡Bienvenido!</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder al sistema</p>
      </div>

      <!-- Alerta de Error -->
      @if (mensajeError) {
      <div class="alert-danger">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ mensajeError }}</span>
      </div>
      }

      <form (ngSubmit)="onLogin()" #formLogin="ngForm" class="login-form">
        <!-- Campo Correo -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              [(ngModel)]="credentials.email"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              [(ngModel)]="credentials.password"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <!-- Botón de Ingreso -->
        <button type="submit" class="btn-login" [disabled]="!formLogin.valid || cargando">
          <span>{{ cargando ? 'Iniciando sesión...' : 'Ingresar al Sistema' }}</span>
          @if (!cargando) {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          }
        </button>
      </form>
    </div>

  </div>
</div>
